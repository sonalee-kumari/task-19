<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MERN Stack JavaScript DOM Project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

 
  <header class="navbar">
    <div class="nav-left">
      <div class="logo">⚡ ServiceHub</div>
      <nav class="nav-links">
        <a href="#home">Home</a>
        <a href="#services">Services</a>
        <a href="#about">About Us</a>
        <a href="#contact">Contact Us</a>
      </nav>
    </div>
    <div class="nav-right">
      <span class="username">John Doe</span>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="main-container">
 
    <section class="left-section">
      <h2>Added Services</h2>
      <div id="addedItemsContainer" class="items-list">
        <p class="empty-msg" id="emptyMsg">No items have been added.</p>
      </div>

      <div class="total-container">
        <h3>Total Amount: $<span id="totalAmount">0</span></h3>
      </div>

      
      <div class="booking-form-container">
        <h3>Book Now</h3>
        <form id="bookingForm">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required />
          </div>
          <button type="submit" class="btn-book-submit">Book Now</button>
        </form>
      </div>
    </section>

    
    <section class="right-section">
      <div class="section-header">
        <h2>Browse Our Services</h2>
        <p>Explore our wide selection of professional services and add them to your cart.</p>
      </div>

      <div class="services-grid" id="servicesGrid">
       
      </div>

      <div class="cart-booking-options">
        <p>Manage items or complete your booking below:</p>
        <div class="option-buttons">
          <button class="btn-primary" id="reviewCartBtn">Add to Cart</button>
          <button class="btn-success" id="quickBookBtn">Book Now</button>
        </div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
